name: Train Guru Engine AI (Saturday 04:00)

on:
  schedule:
    - cron: '0 4 * * 6' # Run at 04:00 UTC every Saturday
  workflow_dispatch: # Allow manual triggering

jobs:
  train-ai:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn xgboost yfinance requests

      - name: Train Guru Engine models
        run: python train_guru.py

      - name: Commit updated models to GitHub
        run: |
          git config user.name "AI Trading Bot"
          git config user.email "bot@example.com"
          git add models/
          git commit -m "🤖 [BOT] Weekly Guru Engine AI Retrain (Saturday)" || echo "No changes to commit"
          git push
