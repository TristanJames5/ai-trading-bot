# .github/workflows/daily_train.yml
name: Daily Model Retraining

on:
  schedule:
    - cron: '0 0 * * *'   # Midnight UTC every day
  workflow_dispatch:      # Allow manual triggering

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install xgboost yfinance pandas numpy scikit-learn

      - name: Train all pair models
        run: python train_v5.py

      - name: Train PRO MAX (Swing) models
        run: python train_swing.py

      - name: Train GURU AI models
        run: python train_guru.py

      - name: Commit updated models to GitHub
        run: |
          git config user.name "AI Trading Bot"
          git config user.email "bot@trading.com"
          git add models/
          git commit -m "Daily retrain $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push
